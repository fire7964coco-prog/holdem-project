<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.hdr { position:absolute; top:34px; left:0; width:100%; text-align:center; }
.hdr h1 { color:#F2EEE3; font-size:34px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.45); }
.hdr h1 .gold { color:#C9A227; }
.hdr .sub { color:#C9A227; font-size:14px; font-weight:700; margin-top:7px; }

.legend { position:absolute; top:126px; left:0; width:100%; display:flex; justify-content:center; gap:34px; }
.legend div { display:flex; align-items:center; gap:9px; color:#F2EEE3; font-size:14px; font-weight:700; opacity:.92; }
.sw { width:22px; height:11px; border-radius:3px; }
.sw.a { background:linear-gradient(90deg,#2E7D46,#39FF6A); }
.sw.b { background:rgba(201,162,39,.85); }

.rows { position:absolute; top:178px; left:96px; width:1008px; }
.r { display:flex; align-items:center; height:96px; }
.name { width:236px; color:#F2EEE3; font-size:19px; font-weight:800; }
.name .o { display:block; color:#C9A227; font-size:13px; font-weight:700; margin-top:4px; letter-spacing:.04em; }
.bars { flex:1; }
.bar { height:26px; border-radius:6px; position:relative; }
.bar.a { background:linear-gradient(90deg,#2E7D46,#39FF6A); box-shadow:0 0 18px rgba(57,255,122,.28); }
.bar.b { background:rgba(201,162,39,.85); margin-top:9px; height:20px; }
.val { position:absolute; left:calc(100% + 12px); top:50%; transform:translateY(-50%); font-size:17px; font-weight:800; white-space:nowrap; }
.bar.a .val { color:#39FF6A; }
.bar.b .val { color:#C9A227; font-size:15px; }

.foot { position:absolute; left:0; bottom:48px; width:100%; text-align:center; color:#F2EEE3; font-size:16px; font-weight:700; opacity:.9; }
.foot b { color:#C9A227; font-weight:800; }
.wordmark { position:absolute; right:44px; bottom:20px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.03em; opacity:.9; }
</style>
</head>
<body>
<div class="stage">
  <div class="hdr">
    <h1>드로우별 완성 확률 &#8212; <span class="gold">한눈에 비교</span></h1>
    <div class="sub">같은 드로우라도 남은 카드가 두 장이냐 한 장이냐로 절반이 갈린다</div>
  </div>

  <div class="legend">
    <div><span class="sw a"></span>플랍 이후 &#183; 리버까지 확정일 때</div>
    <div><span class="sw b"></span>턴 이후 &#183; 한 장만 남았을 때</div>
  </div>

  <div class="rows">
    <div class="r">
      <div class="name">플러시 + 거트샷<span class="o">12 아웃</span></div>
      <div class="bars">
        <div class="bar a" style="width:71%"><span class="val">45%</span></div>
        <div class="bar b" style="width:41%"><span class="val">26%</span></div>
      </div>
    </div>
    <div class="r">
      <div class="name">플러시 드로우<span class="o">9 아웃</span></div>
      <div class="bars">
        <div class="bar a" style="width:55%"><span class="val">35%</span></div>
        <div class="bar b" style="width:30%"><span class="val">19%</span></div>
      </div>
    </div>
    <div class="r">
      <div class="name">양방 스트레이트<span class="o">8 아웃</span></div>
      <div class="bars">
        <div class="bar a" style="width:50%"><span class="val">31.5%</span></div>
        <div class="bar b" style="width:27%"><span class="val">17%</span></div>
      </div>
    </div>
    <div class="r">
      <div class="name">거트샷<span class="o">4 아웃</span></div>
      <div class="bars">
        <div class="bar a" style="width:26%"><span class="val">16.5%</span></div>
        <div class="bar b" style="width:14%"><span class="val">8.7%</span></div>
      </div>
    </div>
  </div>

  <div class="foot">초록 값은 <b>돈 안 내고 리버까지 본다</b>가 확정일 때만 쓴다 &#8212; 턴에 또 베팅이 오면 <b>금색 값</b>으로 비교하라</div>
  <div class="wordmark">&#9824; holdemmaster.com</div>
</div>
</body>
</html>
