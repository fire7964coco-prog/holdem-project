<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#F2EEE3;
}
.hdr { position:absolute; top:40px; left:0; width:100%; text-align:center; }
.hdr h1 { font-size:36px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.45); }
.gold { color:#C9A227; } .green { color:#39FF6A; } .red { color:#FF7A6B; }
.hdr .sub { color:#C9A227; font-size:15px; font-weight:700; margin-top:10px; letter-spacing:.04em; }
.wordmark { position:absolute; right:44px; bottom:22px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.03em; opacity:.9; }
.foot { position:absolute; bottom:60px; left:70px; width:1060px; border-radius:14px; padding:14px 24px; background:rgba(255,255,255,.05); text-align:center; font-size:16px; font-weight:700; }
.foot b { color:#C9A227; font-weight:900; }

.days { position:absolute; top:150px; left:60px; width:1080px; display:flex; gap:16px; }
.d { flex:1; border-radius:16px; background:rgba(8,20,15,.72); border:1px solid rgba(201,162,39,.28); padding:16px 14px 18px; min-height:350px; }
.d .dt { text-align:center; font-size:22px; font-weight:900; }
.d .dw { text-align:center; font-size:13px; font-weight:700; opacity:.6; margin-top:4px; }
.f { margin-top:14px; border-radius:12px; padding:12px 10px; text-align:center; background:rgba(201,162,39,.13); border:1px solid rgba(201,162,39,.4); }
.f .t { font-size:24px; font-weight:900; color:#C9A227; }
.f .nm { font-size:15px; font-weight:800; margin-top:4px; }
.f.last { background:rgba(255,122,107,.13); border-color:rgba(255,122,107,.6); }
.f.last .t { color:#FF7A6B; }
.f.next { background:rgba(57,255,106,.10); border-color:rgba(57,255,106,.45); }
.f.next .t { color:#39FF6A; }
.f .tag { font-size:11px; font-weight:800; opacity:.75; margin-top:4px; }
</style>
</head>
<body>
<div class="stage">

  <div class="hdr">
    <h1>メインイベントの<span class="gold">日程</span></h1>
    <div class="sub">JOPT 2026 大阪 #02 ・ Day 1はすべて「3 Tickets + &#165;8,000」</div>
  </div>
  <div class="days">
    <div class="d"><div class="dt">10.29</div><div class="dw">木</div>
      <div class="f"><div class="t">18:00</div><div class="nm">Day 1A</div></div>
    </div>
    <div class="d"><div class="dt">10.30</div><div class="dw">金</div>
      <div class="f"><div class="t">11:00</div><div class="nm">Day 1B</div></div>
      <div class="f"><div class="t">18:00</div><div class="nm">Day 1C Turbo</div></div>
    </div>
    <div class="d"><div class="dt">10.31</div><div class="dw">土</div>
      <div class="f last"><div class="t">11:00</div><div class="nm">Day 1D Turbo</div><div class="tag">最後の Day 1</div></div>
      <div class="f next"><div class="t">16:00</div><div class="nm">Day 2</div></div>
    </div>
    <div class="d"><div class="dt">11.01</div><div class="dw">日</div>
      <div class="f next"><div class="t">11:00</div><div class="nm">Day 3</div></div>
    </div>
  </div>
  <div class="foot">受付の締切時刻は<b>未発表</b>(2026年9月28日時点) ― 開始時刻に合わせて動く</div>

  <div class="wordmark">&#9824; holdemmaster.com</div>
</div>
</body>
</html>
