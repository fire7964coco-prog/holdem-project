<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Read the Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0B1F17; }
  .stage {
    width: 1200px; height: 675px; overflow: hidden; position: relative; padding: 44px;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
                linear-gradient(160deg, #0B1F17 0%, #13291D 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  }
  .kicker { color: #C9A227; font-size: 15px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
  h1 { color: #F2EEE3; font-size: 44px; font-weight: 800; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  h1 .gold { color: #C9A227; }
  .board-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .group-label { color: #C9A227; font-size: 17px; font-weight: 800; letter-spacing: 4px; }
  .cards { display: flex; gap: 16px; }
  .card { position: relative; width: 108px; height: 154px; background: linear-gradient(175deg,#FDFBF4 0%,#F2EEE3 100%); border-radius: 10px; box-shadow: 0 6px 14px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3); }
  .card .corner { position: absolute; top: 8px; left: 10px; font-size: 26px; font-weight: 800; line-height: 1; text-align: center; }
  .card .corner .csuit { display: block; font-size: 18px; line-height: 1; margin-top: 1px; }
  .card .big { position: absolute; top: 50%; left: 50%; transform: translate(-42%,-44%); font-size: 64px; line-height: 1; }
  .card.back { background: repeating-linear-gradient(45deg,#7a1420 0 10px,#5c0f18 10px 20px); border: 3px solid #F2EEE3; }
  .black { color: #1a1a1a; } .red { color: #c0392b; }
  .hand-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cards-sm { display: flex; gap: 10px; }
  .card-sm { width: 74px; height: 106px; border-radius: 8px; }
  .prompt { color: #F2EEE3; opacity: .85; font-size: 19px; font-weight: 600; text-align: center; letter-spacing: .3px; }
  .wordmark { position: absolute; right: 44px; bottom: 44px; color: #C9A227; font-size: 15px; font-weight: 800; letter-spacing: .04em; opacity: .9; }
</style>
</head>
<body>
<div class="stage">
  <div>
    <div class="kicker">Puzzle 3</div>
    <h1>Find your <span class="gold">best five</span> cards</h1>
  </div>

  <div class="board-wrap">
    <div class="group-label">THE BOARD</div>
    <div class="cards">
      <div class="card"><div class="corner black">K<span class="csuit">&#9824;</span></div><div class="big black">&#9824;</div></div>
      <div class="card"><div class="corner red">K<span class="csuit">&#9830;</span></div><div class="big red">&#9830;</div></div>
      <div class="card"><div class="corner red">K<span class="csuit">&#9829;</span></div><div class="big red">&#9829;</div></div>
      <div class="card"><div class="corner black">A<span class="csuit">&#9824;</span></div><div class="big black">&#9824;</div></div>
      <div class="card"><div class="corner black">2<span class="csuit">&#9824;</span></div><div class="big black">&#9824;</div></div>
    </div>
  </div>

  <div class="hand-wrap">
    <div class="cards-sm">
      <div class="card card-sm back"></div>
      <div class="card card-sm back"></div>
    </div>
    <div class="prompt">Your two hole cards &mdash; do they make a full house?</div>
  </div>

  <div class="wordmark">&#9824;HoldemMaster</div>
</div>
</body>
</html>
