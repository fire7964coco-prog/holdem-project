<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.suits { position:absolute; top:36px; left:0; width:100%; text-align:center; color:#C9A227; font-size:18px; letter-spacing:.5em; opacity:.5; }

.posts { position:absolute; top:86px; left:0; width:100%; display:flex; align-items:center; justify-content:center; gap:22px; }
.post { width:186px; height:112px; border-radius:14px; background:rgba(0,0,0,.28); border:2px solid rgba(201,162,39,.45); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.post .seat { color:#F2EEE3; font-size:19px; font-weight:800; letter-spacing:.14em; opacity:.85; }
.post .amt { color:#C9A227; font-size:40px; font-weight:900; margin-top:5px; line-height:1; }
.post.strad { border-color:#C9A227; background:rgba(201,162,39,.12); box-shadow:0 0 26px rgba(201,162,39,.22); }
.post.strad .seat { color:#C9A227; }
.post.strad .amt { color:#F2EEE3; font-size:44px; }
.x2 { color:#C9A227; font-size:26px; font-weight:900; letter-spacing:.02em; }

.divider { position:absolute; top:228px; left:120px; width:960px; height:2px; background:linear-gradient(90deg,rgba(201,162,39,0),rgba(201,162,39,.55),rgba(201,162,39,0)); }

.order { position:absolute; top:270px; left:0; width:100%; display:flex; align-items:center; justify-content:center; gap:14px; }
.slot { display:flex; flex-direction:column; align-items:center; gap:10px; }
.num { width:38px; height:38px; border-radius:50%; background:#C9A227; color:#0B1F17; font-size:20px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.num.last { background:#39FF6A; color:#0B1F17; font-size:16px; }
.num.mid { background:transparent; border:2px solid rgba(242,238,227,.35); }
.name { color:#F2EEE3; font-size:21px; font-weight:800; letter-spacing:.06em; }
.name.gold { color:#C9A227; }
.name.green { color:#39FF6A; }
.dots { color:#F2EEE3; font-size:28px; font-weight:900; opacity:.45; padding-bottom:2px; }
.arw { color:#C9A227; font-size:24px; font-weight:900; padding-bottom:2px; }

.minraise { position:absolute; left:50%; transform:translateX(-50%); bottom:96px; display:flex; align-items:center; gap:20px; height:96px; padding:0 46px; border-radius:18px; background:rgba(0,0,0,.3); border:2px solid rgba(201,162,39,.5); }
.minraise span { color:#F2EEE3; font-size:42px; font-weight:900; }
.minraise .g { color:#C9A227; }
.minraise .res { color:#C9A227; font-size:52px; font-weight:900; }
.wordmark { position:absolute; right:44px; bottom:20px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.03em; opacity:.9; }
</style>
</head>
<body>
<div class="stage">
  <div class="suits">&#9824; &#9829; &#9830; &#9827;</div>

  <div class="posts">
    <div class="post"><div class="seat">SB</div><div class="amt">1</div></div>
    <div class="post"><div class="seat">BB</div><div class="amt">2</div></div>
    <div class="x2">&#215;2 &#10132;</div>
    <div class="post strad"><div class="seat">UTG STRADDLE</div><div class="amt">4</div></div>
  </div>

  <div class="divider"></div>

  <div class="order">
    <div class="slot"><div class="num">1</div><div class="name gold">UTG+1</div></div>
    <div class="arw">&#10132;</div>
    <div class="dots">&#183;&#183;&#183;</div>
    <div class="arw">&#10132;</div>
    <div class="slot"><div class="num mid"></div><div class="name">SB</div></div>
    <div class="arw">&#10132;</div>
    <div class="slot"><div class="num mid"></div><div class="name">BB</div></div>
    <div class="arw">&#10132;</div>
    <div class="slot"><div class="num last">&#9679;</div><div class="name green">STRADDLE</div></div>
  </div>

  <div class="minraise">
    <span class="g">4</span><span>&#215;</span><span>2</span><span>=</span><span class="res">8</span>
  </div>
  <div class="wordmark">&#9824; holdemmaster.com</div>
</div>
</body>
</html>
