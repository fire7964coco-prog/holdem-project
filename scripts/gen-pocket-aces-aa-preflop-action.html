<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden; padding:38px 44px;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
.kicker { color:#C9A227; font-size:15px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; margin-bottom:8px; }
h1 { color:#F2EEE3; font-size:40px; font-weight:800; text-align:center; text-shadow:0 2px 12px rgba(0,0,0,.45); margin-bottom:18px; }
h1 .gold { color:#C9A227; }
.pair { display:flex; margin-bottom:18px; }
.pair .card:first-child { transform:rotate(-6deg); z-index:1; }
.pair .card:last-child { transform:rotate(6deg); margin-left:-24px; }
.card { position:relative; width:64px; height:92px; background:linear-gradient(175deg,#FDFBF4 0%,#F2EEE3 100%); border-radius:8px; box-shadow:0 5px 12px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); }
.card .corner { position:absolute; top:5px; left:7px; font-size:18px; font-weight:800; line-height:1; text-align:center; }
.card .corner .csuit { display:block; font-size:12px; line-height:1; }
.card .big { position:absolute; top:50%; left:50%; transform:translate(-42%,-44%); font-size:40px; line-height:1; }
.black { color:#1a1a1a; } .red { color:#c0392b; }
.rows { width:100%; display:flex; flex-direction:column; gap:11px; margin-bottom:16px; }
.row { display:grid; grid-template-columns:1fr 210px 200px; align-items:center; gap:16px;
  background:rgba(0,0,0,.28); border:2px solid rgba(201,162,39,.5); border-radius:14px; padding:13px 22px; }
.sit { color:#cfd8c8; font-size:18px; font-weight:600; }
.act { color:#0B1F17; background:#C9A227; border-radius:9px; padding:6px 0; text-align:center; font-size:18px; font-weight:900; }
.size { color:#F2EEE3; font-size:16px; font-weight:700; text-align:right; }
.warn { width:100%; background:rgba(224,123,110,.14); border:2px solid rgba(224,123,110,.45); border-radius:14px; padding:16px 24px; display:flex; align-items:center; gap:18px; }
.wt { flex:none; color:#e07b6e; font-size:18px; font-weight:900; }
.wd { color:#e6ecdf; font-size:18px; font-weight:700; line-height:1.4; }
.wd b { color:#C9A227; font-weight:900; }
.wordmark { position:absolute; right:44px; bottom:16px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.04em; opacity:.9; }
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Pocket Aces &middot; Preflop</div>
  <h1>포켓 에이스(<span class="gold">AA</span>) 프리플랍 액션 기준</h1>
  <div class="pair">
    <div class="card"><div class="corner black">A<span class="csuit">&#9824;</span></div><div class="big black">&#9824;</div></div>
    <div class="card"><div class="corner red">A<span class="csuit">&#9829;</span></div><div class="big red">&#9829;</div></div>
  </div>
  <div class="rows">
    <div class="row"><div class="sit">아무도 안 들어왔다</div><div class="act">오픈 레이즈</div><div class="size">3~4BB</div></div>
    <div class="row"><div class="sit">앞에서 레이즈가 나왔다</div><div class="act">3벳</div><div class="size">상대 레이즈의 3배 안팎</div></div>
    <div class="row"><div class="sit">내 오픈에 3벳이 왔다</div><div class="act">4벳</div><div class="size">또는 스택 얕으면 올인</div></div>
    <div class="row"><div class="sit">올인이 앞에 있다</div><div class="act">콜</div><div class="size">AA는 접을 자리가 아니다</div></div>
  </div>
  <div class="warn">
    <div class="wt">사이즈는 늘 똑같이</div>
    <div class="wd">AA만 크게 치면 <b>패턴이 읽힌다</b> &mdash; KK&middot;QQ&middot;AKs와 같은 사이즈로 올려야 팟이 커진다</div>
  </div>
  <div class="wordmark">&#9824;HoldemMaster</div>
</div>
</body>
</html>
