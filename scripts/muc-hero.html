<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:675px; overflow:hidden;
    background:linear-gradient(160deg,#faf7ef 0%,#f2ece0 100%);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    position:relative;
  }
  .wrap { position:absolute; inset:0; }

  .title { position:absolute; top:38px; left:56px; }
  .title h1 { font-size:40px; font-weight:800; color:#1d3b31; letter-spacing:-.5px; }
  .title .accent { color:#b8912a; }
  .title p { margin-top:8px; font-size:19px; color:#5d6b64; font-weight:500; }

  /* connector lines */
  svg.lines { position:absolute; inset:0; }

  .node { position:absolute; transform:translate(-50%,-50%); text-align:center; }
  .dot {
    width:15px; height:15px; border-radius:50%;
    background:#1d3b31; margin:0 auto 9px;
    box-shadow:0 0 0 5px rgba(29,59,49,.13);
  }
  .name { font-size:20px; font-weight:700; color:#1d3b31; white-space:nowrap; line-height:1.15; }
  .meta { margin-top:5px; font-size:16px; color:#6c7a72; font-weight:600; white-space:nowrap; }
  .price {
    display:inline-block; margin-top:7px; padding:3px 12px;
    background:#b8912a; color:#fff; border-radius:20px;
    font-size:16px; font-weight:800; letter-spacing:.2px;
  }

  /* center */
  .center { position:absolute; left:600px; top:352px; transform:translate(-50%,-50%); text-align:center; }
  .center .ring {
    width:132px; height:132px; border-radius:50%;
    background:#fff; border:3px dashed #c9a227;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; margin:0 auto;
    box-shadow:0 6px 20px rgba(29,59,49,.10);
  }
  .center .muc { font-size:26px; font-weight:800; color:#1d3b31; }
  .center .sub { margin-top:3px; font-size:13px; color:#a5342f; font-weight:700; letter-spacing:.3px; }

  .wm {
    position:absolute; right:30px; bottom:24px;
    display:flex; align-items:center; gap:9px; opacity:.62;
  }
  .wm svg { width:21px; height:21px; }
  .wm span { font-size:17px; font-weight:700; color:#8a7a4e; letter-spacing:.2px; }
</style>
<div class="wrap">
  <div class="title">
    <h1>Pokerturniere <span class="accent">um München</span></h1>
    <p>Die fünf nächsten Spielbanken – Spieltag und Buy-in</p>
  </div>

  <svg class="lines" width="1200" height="675" viewBox="0 0 1200 675">
    <g stroke="#c9a227" stroke-width="1.6" stroke-dasharray="5 6" opacity=".55" fill="none">
      <line x1="600" y1="352" x2="318" y2="212"/>
      <line x1="600" y1="352" x2="905" y2="212"/>
      <line x1="600" y1="352" x2="228" y2="452"/>
      <line x1="600" y1="352" x2="640" y2="560"/>
      <line x1="600" y1="352" x2="382" y2="560"/>
    </g>
  </svg>

  <div class="node" style="left:318px; top:212px;">
    <div class="dot"></div>
    <div class="name">Feuchtwangen</div>
    <div class="meta">Sonntag · 18:00</div>
    <div class="price">60 €</div>
  </div>

  <div class="node" style="left:905px; top:212px;">
    <div class="dot"></div>
    <div class="name">Bad Kötzting</div>
    <div class="meta">Sonntag · 17:00</div>
    <div class="price">110 €</div>
  </div>

  <div class="node" style="left:228px; top:452px;">
    <div class="dot"></div>
    <div class="name">Lindau</div>
    <div class="meta">Sonntag · 17:00</div>
    <div class="price">88 €</div>
  </div>

  <div class="node" style="left:640px; top:560px;">
    <div class="dot"></div>
    <div class="name">Bad Wiessee</div>
    <div class="meta">Sonntag · 18:00</div>
    <div class="price">110 €</div>
  </div>

  <div class="node" style="left:382px; top:560px;">
    <div class="dot"></div>
    <div class="name">Garmisch-Partenkirchen</div>
    <div class="meta">Freitag · 19:30</div>
    <div class="price">110–210 €</div>
  </div>

  <div class="center">
    <div class="ring">
      <div class="muc">München</div>
      <div class="sub">keine Spielbank</div>
    </div>
  </div>

  <div class="wm">
    <svg viewBox="0 0 24 24" fill="#b8912a"><path d="M12 2C9 6.5 4 9.5 4 13.5A4.5 4.5 0 0 0 11 17c0 1.8-.7 3.2-2 4h6c-1.3-.8-2-2.2-2-4a4.5 4.5 0 0 0 7-3.5C20 9.5 15 6.5 12 2z"/></svg>
    <span>holdemmaster.com</span>
  </div>
</div>
