<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#F2EEE3;
}
.hdr { position:absolute; top:40px; left:0; width:100%; text-align:center; }
.hdr h1 { font-size:36px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.45); }
.gold { color:#C9A227; } .green { color:#39FF6A; } .red { color:#FF7A6B; }
.hdr .sub { color:#C9A227; font-size:15px; font-weight:700; margin-top:10px; letter-spacing:.04em; }
.wordmark { position:absolute; right:44px; bottom:22px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.03em; opacity:.9; }
.foot { position:absolute; bottom:60px; left:70px; width:1060px; border-radius:14px; padding:14px 24px; background:rgba(255,255,255,.05); text-align:center; font-size:16px; font-weight:700; }
.foot b { color:#C9A227; font-weight:900; }

.chart { position:absolute; top:146px; left:60px; width:760px; }
.row { display:flex; align-items:center; height:44px; }
.row .lb { width:140px; text-align:right; padding-right:18px; font-size:17px; font-weight:800; }
.row .bar { height:26px; border-radius:6px; background:linear-gradient(90deg,#2E7D46,#39FF6A); }
.row.hi .bar { background:linear-gradient(90deg,#8a6d12,#C9A227); }
.row .v { margin-left:12px; font-size:17px; font-weight:900; }
.sep { height:1px; background:rgba(242,238,227,.18); margin:6px 0 6px 140px; }
.cap { position:absolute; right:70px; top:196px; width:300px; border-radius:16px; padding:26px 20px; background:rgba(8,20,15,.78); border:1px solid rgba(57,255,106,.45); text-align:center; }
.cap .n { font-size:46px; font-weight:900; color:#39FF6A; line-height:1.1; }
.cap .u { font-size:15px; font-weight:700; opacity:.8; margin-top:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="stage">

  <div class="hdr">
    <h1>サイドイベントの<span class="gold">参加費別の枠数</span></h1>
    <div class="sub">JOPT 2026 大阪 #02 ・ 現金で入れる62枠</div>
  </div>
  <div class="chart">
    <div class="row"><div class="lb">&#165;8,800</div><div class="bar" style="width:38px"></div><div class="v">1</div></div>
    <div class="row"><div class="lb">&#165;10,000</div><div class="bar" style="width:342px"></div><div class="v">9</div></div>
    <div class="row"><div class="lb">&#165;12,000</div><div class="bar" style="width:342px"></div><div class="v">9</div></div>
    <div class="row"><div class="lb">&#165;15,000</div><div class="bar" style="width:456px"></div><div class="v">12</div></div>
    <div class="sep"></div>
    <div class="row hi"><div class="lb">&#165;20,000</div><div class="bar" style="width:266px"></div><div class="v">7</div></div>
    <div class="row hi"><div class="lb">&#165;25,000</div><div class="bar" style="width:152px"></div><div class="v">4</div></div>
    <div class="row hi"><div class="lb">&#165;30,000</div><div class="bar" style="width:418px"></div><div class="v">11</div></div>
    <div class="row hi"><div class="lb">&#165;50,000〜</div><div class="bar" style="width:342px"></div><div class="v">9</div></div>
  </div>
  <div class="cap"><div class="n">31枠</div><div class="u">62枠のうち半分が<br>&#165;15,000以下</div></div>
  <div class="foot">「枠」は表の行数。同じイベントが日を変えて<b>何度も組まれている</b></div>

  <div class="wordmark">&#9824; holdemmaster.com</div>
</div>
</body>
</html>
