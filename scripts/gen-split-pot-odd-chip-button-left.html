<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.hdr { position:absolute; top:34px; left:0; width:100%; text-align:center; }
.hdr h1 { color:#F2EEE3; font-size:34px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.45); }
.hdr h1 .gold { color:#C9A227; }
.hdr .sub { color:#C9A227; font-size:14px; font-weight:700; margin-top:8px; }

.flow { position:absolute; top:168px; left:92px; width:1016px; display:flex; align-items:center; gap:20px; }
.node { flex:1; border-radius:16px; padding:26px 20px; background:rgba(8,20,15,.68); border:1px solid rgba(201,162,39,.30); text-align:center; }
.node .k { color:#C9A227; font-size:13px; font-weight:800; letter-spacing:.11em; }
.node .v { color:#F2EEE3; font-size:36px; font-weight:900; margin-top:10px; line-height:1.1; }
.node .c { color:#F2EEE3; opacity:.72; font-size:13px; font-weight:700; margin-top:9px; }
.node.odd { border-color:rgba(57,255,122,.5); }
.node.odd .v { color:#39FF6A; }
.arrow { color:#C9A227; font-size:32px; font-weight:900; }

.split { position:absolute; top:352px; left:92px; width:1016px; display:flex; gap:20px; }
.half { flex:1; border-radius:14px; padding:20px; text-align:center; background:rgba(255,255,255,.05); }
.half .k { color:#C9A227; font-size:13px; font-weight:800; letter-spacing:.1em; }
.half .v { color:#F2EEE3; font-size:28px; font-weight:900; margin-top:8px; }

.rule {
  position:absolute; top:352px; right:92px; width:404px; padding:22px 24px; border-radius:14px;
  background:rgba(201,162,39,.12); border:1px dashed rgba(201,162,39,.55);
}
.rule .k { color:#C9A227; font-size:13px; font-weight:900; letter-spacing:.1em; }
.rule .v { color:#F2EEE3; font-size:19px; font-weight:800; margin-top:10px; line-height:1.5; }
.rule .v em { font-style:normal; color:#39FF6A; }
.rule .src { color:#F2EEE3; opacity:.7; font-size:12px; font-weight:700; margin-top:11px; }

.foot { position:absolute; left:0; bottom:46px; width:100%; text-align:center; color:#F2EEE3; font-size:17px; font-weight:700; opacity:.92; }
.foot b { color:#C9A227; font-weight:800; }
.wordmark { position:absolute; right:44px; bottom:19px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.03em; opacity:.9; }
</style>
</head>
<body>
<div class="stage">
  <div class="hdr">
    <h1>반으로 안 나뉘는 팟, <span class="gold">남는 1칩은 누가</span></h1>
    <div class="sub">홀덤은 무늬가 아니라 &#171;버튼과의 거리&#187;로 정한다</div>
  </div>

  <div class="flow" style="width:596px;">
    <div class="node">
      <div class="k">팟</div>
      <div class="v">101,000원</div>
      <div class="c">1,000원 칩 101개</div>
    </div>
    <div class="arrow">&#8594;</div>
    <div class="node odd">
      <div class="k">나누고 남는 것</div>
      <div class="v">1칩</div>
      <div class="c">101은 2로 나뉘지 않는다</div>
    </div>
  </div>

  <div class="split" style="width:596px;">
    <div class="half"><div class="k">플레이어 A</div><div class="v">50,000원</div></div>
    <div class="half"><div class="k">플레이어 B</div><div class="v">50,000원</div></div>
  </div>

  <div class="rule">
    <div class="k">공 식 규 정</div>
    <div class="v">남는 1칩은 <em>버튼 왼쪽에서 가장 가까운</em> 남은 플레이어에게 간다</div>
    <div class="src">WSOP 2026 공식 룰 Rule 73 &#183; 무늬로 정하는 방식은 스터드&#183;라즈 규정이다</div>
  </div>

  <div class="foot">&#171;제일 높은 무늬가 가져간다&#187;는 <b>7포커 습관</b> &#8212; 홀덤에는 무늬 서열이 없다</div>
  <div class="wordmark">&#9824; holdemmaster.com</div>
</div>
</body>
</html>
