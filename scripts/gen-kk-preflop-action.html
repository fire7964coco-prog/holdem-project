<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#0B1F17; }
.stage {
  position:relative; width:1200px; height:675px; overflow:hidden; padding:38px 44px;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(46,125,70,0.26), rgba(46,125,70,0) 65%),
    linear-gradient(160deg,#0B1F17 0%,#13291D 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
.kicker { color:#C9A227; font-size:15px; font-weight:700; letter-spacing:.28em; text-transform:uppercase; text-align:center; margin-bottom:8px; }
h1 { color:#F2EEE3; font-size:40px; font-weight:800; text-align:center; text-shadow:0 2px 12px rgba(0,0,0,.45); margin-bottom:20px; }
h1 .gold { color:#C9A227; }
.pair { display:flex; margin-bottom:20px; }
.pair .card:first-child { transform:rotate(-6deg); z-index:1; }
.pair .card:last-child { transform:rotate(6deg); margin-left:-26px; }
.card { position:relative; width:68px; height:98px; background:linear-gradient(175deg,#FDFBF4 0%,#F2EEE3 100%); border-radius:8px; box-shadow:0 5px 12px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); }
.card .corner { position:absolute; top:5px; left:7px; font-size:18px; font-weight:800; line-height:1; text-align:center; }
.card .corner .csuit { display:block; font-size:12px; line-height:1; margin-top:1px; }
.card .big { position:absolute; top:50%; left:50%; transform:translate(-42%,-44%); font-size:42px; line-height:1; }
.black { color:#1a1a1a; } .red { color:#c0392b; }
.rows { width:100%; display:flex; flex-direction:column; gap:12px; }
.row { display:grid; grid-template-columns:1fr 250px 190px; align-items:center; gap:16px;
  background:rgba(0,0,0,.28); border:2px solid rgba(201,162,39,.5); border-radius:14px; padding:15px 22px; }
.sit { color:#cfd8c8; font-size:19px; font-weight:600; }
.act { color:#0B1F17; background:#C9A227; border-radius:9px; padding:7px 0; text-align:center; font-size:19px; font-weight:900; }
.act.dim { background:rgba(201,162,39,.22); color:#C9A227; }
.size { color:#F2EEE3; font-size:17px; font-weight:700; text-align:right; }
.note { margin-top:16px; color:#9fb39a; font-size:16px; font-weight:600; text-align:center; }
.note b { color:#C9A227; }
.wordmark { position:absolute; right:44px; bottom:18px; color:#C9A227; font-size:15px; font-weight:800; letter-spacing:.04em; opacity:.9; }
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Pocket Kings &middot; Preflop</div>
  <h1>포켓 킹(<span class="gold">KK</span>) 프리플랍 액션 기준</h1>
  <div class="pair">
    <div class="card"><div class="corner black">K<span class="csuit">&#9824;</span></div><div class="big black">&#9824;</div></div>
    <div class="card"><div class="corner red">K<span class="csuit">&#9829;</span></div><div class="big red">&#9829;</div></div>
  </div>
  <div class="rows">
    <div class="row"><div class="sit">아무도 안 들어왔다</div><div class="act">오픈 레이즈</div><div class="size">3~4BB</div></div>
    <div class="row"><div class="sit">앞에서 레이즈가 나왔다</div><div class="act">3벳</div><div class="size">상대 레이즈의 3~3.5배</div></div>
    <div class="row"><div class="sit">내 오픈에 3벳이 왔다</div><div class="act">4벳</div><div class="size">3벳 크기의 2.2~2.5배</div></div>
    <div class="row"><div class="sit">5벳 올인이 돌아왔다</div><div class="act dim">콜 또는 올인</div><div class="size">스택 깊이로 판단</div></div>
  </div>
  <div class="note">림프&middot;콜만으로 들어가는 것이 KK에서 가장 큰 낭비 &mdash; <b>상대 수를 줄이는 것</b>이 목표다</div>
  <div class="wordmark">&#9824;HoldemMaster</div>
</div>
</body>
</html>
